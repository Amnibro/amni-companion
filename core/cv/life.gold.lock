fn life_eye_cal(p const real[:], d const real[:], n int, ax int) real {
	fn moves(v int) bool { abs(d[3 * v]) > 1e-7 || abs(d[3 * v + 1]) > 1e-7 || abs(d[3 * v + 2]) > 1e-7 }
	var any = false;
	var x0 = 0.0;
	var x1 = 0.0;
	var y0 = 0.0;
	var y1 = 0.0;
	var z1 = 0.0;
	for v in n {
		if !moves(v) { continue; }
		let x = p[3 * v];
		let y = p[3 * v + 1];
		let z = p[3 * v + 2];
		if !any {
			x0 = x;
			x1 = x;
			y0 = y;
			y1 = y;
			z1 = z;
			any = true;
		} else {
			x0 = min(x0, x);
			x1 = max(x1, x);
			y0 = min(y0, y);
			y1 = max(y1, y);
			z1 = max(z1, z);
		}
	}
	if !any { return 0.0; }
	let R = ((x1 - x0) + (y1 - y0)) / 4.0;
	let cz = z1 - R;
	var num = 0.0;
	var den = 0.0;
	for v in n {
		if !moves(v) { continue; }
		let z = p[3 * v + 2];
		if z > cz {
			let r = z - cz;
			num += d[3 * v + ax] * r;
			den += r * r;
		}
	}
	if den > 1e-12 {
		let s = clamp(num / den, -1.0, 1.0);
		return atan2(s, sqrt(max(0.0, 1.0 - s * s)));
	}
	return 0.0;
}
