struct Hold { since real, on bool, done bool }
struct Rev { has bool, ext real, dir int, n int, ts real[4] }
var FIRED bool[NEV];
var LASTF real[NEV];
fn cool(code int) real {
	match code {
		1, 2 => 0.0,
		16 => 10.0,
		_ => 2.5,
