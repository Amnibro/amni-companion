}
fn held(h Hold&, cond bool, t real, dur real) bool {
	if !cond {
		h.on = false;
		h.done = false;
		return false;
	}
	if !h.on {
		h.on = true;
		h.since = t;
		h.done = false;
	}
	if !h.done && t - h.since >= dur {
		h.done = true;
		return true;
	}
	return false;
}
fn rev_add(r Rev&, t real) {
	if r.n == 4 {
		for i in 3 { r.ts[i] = r.ts[i + 1]; }
		r.n = 3;
	}
	r.ts[r.n] = t;
	r.n += 1;
}
fn rev_fire(r Rev&, v real, t real, thr real, need int, win real) bool {
	if !r.has {
		r.has = true;
		r.ext = v;
		r.dir = 0;
		return false;
	}
	if r.dir == 0 {
		if v > r.ext + thr { r.dir = 1; r.ext = v; }
		else if v < r.ext - thr { r.dir = -1; r.ext = v; }
	} else if r.dir > 0 {
		if v > r.ext { r.ext = v; }
		else if v < r.ext - thr { r.dir = -1; r.ext = v; rev_add(r, t); }
	} else {
		if v < r.ext { r.ext = v; }
		else if v > r.ext + thr { r.dir = 1; r.ext = v; rev_add(r, t); }
	}
	var c = 0;
	for i in r.n { if t - r.ts[i] <= win { c += 1; } }
