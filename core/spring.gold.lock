fn md(xs f32[>..]&) f32 {
	if xs.len == 0 { return 0.07; }
	var i = 1;
	while i < xs.len {
		let key = xs[i];
		var j = i - 1;
		while j >= 0 && xs[j] > key {
			xs[j + 1] = xs[j];
			j -= 1;
		}
		xs[j + 1] = key;
		i += 1;
	}
	var idx = floor(xs.len as real * 0.99) as int;
	if idx > xs.len - 1 { idx = xs.len - 1; }
	if idx < 0 { idx = 0; }
	return xs[idx];
}
