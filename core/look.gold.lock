fn look_setup(asset int) {
	if lk_tex.len == 0 {
		let bumps f32[8] = [2.2, 2.4, 2.4, 2.0, 2.0, 1.1, 2.0, 2.4];
		for kind in 8 {
			let n = if kind == 0 { 512 } else { 128 };
			lk_tex.push(lk_make_tile(kind, n, bumps[kind]));
		}
	}
	lk_skin_geo(asset);
	let tiles f32[8] = [0.0, 0.0125, 0.022, 0.009, 0.0075, 0.03, 0.017, 0.009];
	let strength f32[8] = [0.0, 0.9, 1.0, 0.8, 0.9, 0.5, 0.8, 0.8];
	let wraps f32[8] = [0.0, 0.25, 0.25, 0.2, 0.15, 0.35, 0.2, 0.2];
	let fuzzs f32[8] = [0.0, 0.5, 0.5, 0.35, 0.25, 1.0, 0.3, 0.4];
	let specs f32[8] = [0.0, 0.55, 0.55, 0.5, 0.7, 0.35, 0.8, 0.7];
	let ms = gltf::assets[asset].materials;
	for m in ms.first..ms.first + ms.count {
		let name = gltf::text_of(gltf::materials[m].name);
		let k = lk_pick(name);
		var x = gltf::materials[m];
		if k == 0 {
			x.shading = 1;
			x.shade_a = float4 { 0.0024, 0.00095, 0.0005, 1.4 };
			x.shade_b = float4 { 0.35, 0.45, 0.12, 0.55 };
			x.shade_c = float4 { 0.028, 0.0, 0.0, 0.55 };
			x.detail = gltf::TexRef { texture: lk_tex[0], m: lk_scale(asset, m, 0.009), .. };
			if name == "skin" { x.roughness = 0.6; }
			if name == "face" { x.roughness = 1.15; }
		}
		if name == "teeth" {
			x.shading = 1;
			x.shade_a = float4 { 0.0007, 0.0005, 0.0004, 0.0 };
			x.shade_b = float4 { 0.0, 0.0, 0.3, 0.5 };
			x.shade_c = float4 { 0.04, 0.0, 0.0, 0.3 };
		}
		if name == "tongue" || name == "mouth" {
			x.shading = 1;
			x.shade_a = float4 { 0.0015, 0.0007, 0.0003, 0.0 };
			x.shade_b = float4 { 0.0, 0.0, 0.3, 0.5 };
			x.shade_c = float4 { 0.028, 0.0, 0.0, 0.3 };
		}
		if name == "eyes" {
			let c, r = lk_iris(x.base_tex.texture);
			x.shading = 2;
			x.shade_a = c;
			x.shade_b = float4 { 0.0, 0.0, 1.0, 0.035 };
			x.shade_c = float4 { r, 0.0024, 0.55, 0.35 };
			x.roughness = 0.5;
		}
		if k >= 1 {
