			x.normal_tex = gltf::TexRef { -1, 0 };
			x.detail = gltf::TexRef { texture: lk_tex[k], m: lk_scale(asset, m, tiles[k]), .. };
			x.shade_b = float4 { strength[k], 0.85, 0.0, 0.0 };
			x.shade_a = float4 { wraps[k], fuzzs[k], specs[k], 0.0 };
