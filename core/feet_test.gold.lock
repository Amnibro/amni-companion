fn knee_run() f32 {
	mix_feet(true);
	mix_rest();
	mix_play(walk_c, 0.0);
	let v = mix_speed(walk_c) * 0.85;
	var low f32 = 1.0;
	for i in 120 {
		put(0.0, v * (i as f32) / 30.0, 0.0);
		mix_advance(1.0 / 30.0);
		s3d::pose(it);
		for f in 2 {
			let h = pos(motion::world[slot_node[14 + 4 * f]]);
			let n = pos(motion::world[slot_node[15 + 4 * f]]);
			let e = pos(motion::world[slot_node[16 + 4 * f]]);
			let d = n.z - (h.z + (e.z - h.z) * ((n.y - h.y) / min(e.y - h.y, -0.0001)));
			if d < low { low = d; }
		}
	}
	low
}
