fn setup() int, int {
	let asset = gltf::load("../web/models/holo.glb");
	let it = s3d::add(asset);
	let nlib = clips::clips_load("../web/anim/AnimationLibrary_Godot_Standard.gltf", asset);
	var sl i32[22];
	let first = gltf::assets[asset].nodes.first;
	for i in 22 { sl[i] = if clips::kc_slot[i] < 0 { -1 } else { (clips::kc_slot[i] as int - first) as i32 }; }
	mix_open(asset, it, sl[..]);
	for c in nlib { mix_clip(clips::kc_nf[c], clips::kc_loop[c], clips::clips_frames(c)); }
	var idle = -1;
	var walk = -1;
	var nb byte[>..] = [];
	for k in nlib {
		nb.clear();
		clips::clips_name(k, nb);
		if nb == "Idle_Loop" { idle = k; }
		if nb == "Walk_Formal_Loop" { walk = k; }
	}
	return idle, walk;
}
