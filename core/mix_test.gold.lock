		adv(1);
		own = max(own, pose_diff(snap));
	}
	mix_play(idle, 0.0);
	adv(30);
	snap = cur_q;
	mix_play(walk, 0.3);
	adv(1);
	let jump = pose_diff(snap);
	var prev f32[22] = [0.0; 22];
	var x0 f32 = 0.0;
	for k in 22 {
		if slot_node[k] >= 0 {
			prev[k] = off(walk, k, 1);
			x0 = max(x0, prev[k]);
		}
	}
	var step f32 = 0.0;
	var grow f32 = -1000000000.0;
	for i in 2..11 {
		adv(1);
		for k in 22 {
			if slot_node[k] >= 0 {
				let o = off(walk, k, i);
				step = max(step, abs(o - prev[k]));
				grow = max(grow, o - prev[k]);
				prev[k] = o;
			}
		}
	}
	var settle f32 = 0.0;
	for k in 22 { if slot_node[k] >= 0 { settle = max(settle, prev[k]); } }
	return cut, own, jump, x0, step, grow, settle;
}
