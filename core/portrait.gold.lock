	look_setup(asset);
	fn hide(name const byte[:]) {
		for i in gltf::assets[asset].nodes.count {
			let n = gltf::assets[asset].nodes.first + i;
			if gltf::nodes[n].mesh >= 0 {
				if gltf::text_of(gltf::meshes[gltf::nodes[n].mesh].name) == name { gltf::nodes[n].mesh = -1; }
			}
		}
	}
	for i in gltf::assets[asset].materials.count {
		let m = gltf::assets[asset].materials.first + i;
		let nm = gltf::text_of(gltf::materials[m].name);
		if tv(t, 13, 0.0) > 0.0 && nm == "face" { gltf::materials[m].roughness = tv(t, 13, 0.0); }
		if tv(t, 19, 0.0) > 0.0 && nm == "skin" { gltf::materials[m].roughness = tv(t, 19, 0.0); }
		if nm == "skin" || nm == "face" {
			if tv(t, 15, 0.0) > 0.0 { gltf::materials[m].shade_c.y = tv(t, 15, 0.0); }
			if tv(t, 16, -1.0) >= 0.0 { gltf::materials[m].shade_c.z = tv(t, 16, -1.0); }
			gltf::materials[m].shade_a.x *= tv(t, 18, 1.0);
			gltf::materials[m].shade_a.y *= tv(t, 18, 1.0);
			gltf::materials[m].shade_a.z *= tv(t, 18, 1.0);
			let k = tv(t, 17, 0.0);
			let bx = gltf::materials[m].base.x;
			let by = gltf::materials[m].base.y;
			let bz = gltf::materials[m].base.z;
			let mean = (bx + by + bz) / 3.0;
			gltf::materials[m].base.x = bx + (mean - bx) * k;
			gltf::materials[m].base.y = by + (mean - by) * k;
			gltf::materials[m].base.z = bz + (mean - bz) * k;
		}
		if tv(t, 20, 0.0) > 0.0 && nm == "eyes" { gltf::materials[m].roughness = tv(t, 20, 0.0); }
	}
	if tv(t, 21, 0.0) > 0.0 { hide("eye_occ"); }
	let ep, en = eye_pair(asset);
	let mid = (ep + en) * 0.5;
	let ipd = linalg::length3(ep - en);
	let fov = tv(t, 4, 0.3);
	let th = linalg::f(tan((fov * 0.5) as real));
	let d = ipd / (tv(t, 5, 0.241) * 2.0 * th * (w as f32) / (h as f32));
	let fh = 2.0 * d * th;
	let at = mid - float3 { 0.0, (0.5 - tv(t, 6, 0.408)) * fh, 0.0 };
	print("portrait: eyes ", ep, en, " spacing ", ipd, " distance ", d);
	let g = tv(t, 10, 0.55);
	var bm = shapes::material(linalg::v3(g, g * 0.985, g * 1.03), 0.0, 0.95);
	bm.double_sided = true;
	let bs = shapes::sheet(7, mid + float3 { -2.5, -2.5, -1.4 }, float3 { 5.0, 0.0, 0.0 }, float3 { 0.0, 5.0, 0.0 }, bm);
	s3d::place(s3d::add(bs), gfx::mat4_identity);
	s3d::alpha_to_coverage = true;
	s3d::init(w, h);
	var gs int[>..] = [];
	let sn = mesh_node(asset, "scalp");
	if tv(t, 22, 1.0) > 0.0 && sn >= 0 {
		var pos f32[>..] = [];
		var nrm f32[>..] = [];
		var idx int[>..] = [];
		hair::mesh_soup(sn, pos, nrm, idx);
		let nv = pos.len / 3;
		var top f32 = -1e30;
		for i in nv {
			if pos[i * 3 + 1] > top { top = pos[i * 3 + 1]; }
		}
		var x0 f32 = 1e30;
		var x1 f32 = -1e30;
		var z0 f32 = 1e30;
		var z1 f32 = -1e30;
		for i in nv {
			if pos[i * 3 + 1] > top - 0.14 {
				x0 = min(x0, pos[i * 3]);
				x1 = max(x1, pos[i * 3]);
				z0 = min(z0, pos[i * 3 + 2]);
				z1 = max(z1, pos[i * 3 + 2]);
			}
		}
		let rx = (x1 - x0) * 0.5;
		let rz = (z1 - z0) * 0.5;
		let ry = (rx + rz) * 0.5;
		let r = max(rx, max(ry, rz));
		let c = float3 { (x0 + x1) * 0.5, top - ry, (z0 + z1) * 0.5 };
		let sc = float3 { rx / r, ry / r, rz / r };
		var rp float3[>..] = [];
		var rn float3[>..] = [];
		let _ = hair::mesh_roots(sn, float3 { -1.0, top - 0.19, -1.0 }, float3 { 1.0, top + 1.0, 1.0 }, tv(t, 23, 2500.0) as int, 7, rp, rn);
		let dir = linalg::unit3(float3 { 0.0, 0.6, -0.8 });
		let st = hair::Style { steps: 24, length: 0.3, width: 0.004, clumps: 300, head: float4 { c.x, c.y, c.z, r }, head_scale: sc, gather: c + float3 { dir.x * sc.x, dir.y * sc.y, dir.z * sc.z } * (r * 1.08), bun: 0.032, .. };
		var data byte[>..] = [];
