fn gray_bg() {
	var rs f32[>..] = [];
	var gs f32[>..] = [];
	var bs f32[>..] = [];
	for y in th {
		for x in tw {
			if y == 0 || y == th - 1 || x == 0 || x == tw - 1 {
				let i = y * tw + x;
				rs.push(at(tpx, i, 0));
				gs.push(at(tpx, i, 1));
				bs.push(at(tpx, i, 2));
			}
		}
	}
	sort(rs) { p, q => p < q };
	sort(gs) { p, q => p < q };
	sort(bs) { p, q => p < q };
	bg = float3 { rs[rs.len / 2], gs[gs.len / 2], bs[bs.len / 2] };
	let n = tw * th;
	var seen byte[>..] = [];
	seen.resize(n, 0);
	var stack int[>..<] = [];
	for i in n { tmask[i] = 1.0; }
	fn visit(i int, from int) {
		if seen[i] != 0 { return; }
		let r = at(tpx, i, 0);
		let g = at(tpx, i, 1);
		let b = at(tpx, i, 2);
		let r0 = at(tpx, from, 0);
		let g0 = at(tpx, from, 1);
		let b0 = at(tpx, from, 2);
		let dp = max(max(abs(r - r0), abs(g - g0)), abs(b - b0));
		let db = max(max(abs(r - bg.x), abs(g - bg.y)), abs(b - bg.z));
		let sat = max(max(r, g), b) - min(min(r, g), b);
		if dp <= 6.0 && db <= 40.0 && sat <= 18.0 {
			seen[i] = 1;
			tmask[i] = 0.0;
			stack.push(i);
		}
	}
	for y in th {
		for x in tw {
			if y == 0 || y == th - 1 || x == 0 || x == tw - 1 {
				let i = y * tw + x;
				visit(i, i);
			}
		}
	}
	while stack.len > 0 {
		let p = stack.pop();
		let x = p % tw;
		let y = p / tw;
		if x > 0 { visit(p - 1, p); }
		if x < tw - 1 { visit(p + 1, p); }
		if y > 0 { visit(p - tw, p); }
		if y < th - 1 { visit(p + tw, p); }
	}
}
