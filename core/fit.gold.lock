	s3d::sun = s3d::Sun { to_sun: linalg::unit3(float3 { 0.35, 0.8, 1.0 }), rgb: float3 { 2.2, 2.2, 2.2 }, shadows: true, shadow_far: 10.0, map_size: 2048 };
	s3d::add_light(float3 { -14.0, 7.0, 14.0 }, float3 { 260.0, 260.0, 260.0 }, 1000.0);
	s3d::sky = s3d::Sky { zenith: float3 { 0.6, 0.6, 0.6 }, horizon: float3 { 0.55, 0.55, 0.55 }, ground: float3 { 0.3, 0.3, 0.3 }, ambient: 1.0, draw: false };
	s3d::look.bloom = 0.0;
	s3d::look.desaturate = 0.0;
	s3d::look.curve = 1;
	s3d::init(2 * tw, 2 * th);
	big = gfx::render_target(2 * tw, 2 * th, gfx::RGBA8);
	let ty0, ty1, tcx = bbox(tmask);
	if ty1 <= ty0 {
		print("empty target");
		return;
	}
	if !fit_cam(7, true) { return; }
	if !env_zero("FIT_POSE") {
		pose_fit();
		if !fit_cam(3, false) { return; }
		save_pose(str(a[3], "_pose.txt"));
	}
	if !env_zero("FIT_LIGHT") { light_fit(); }
	shot(cam_eye, cam_look);
	var heat byte[>..] = [];
	report("fit", heat);
	if !env_zero("FIT_PAINT") {
		var acc int[>..] = [];
		for r in 4 {
			paint();
			if acc.len != img_changed.len { acc.resize(img_changed.len, 0); }
			for i in acc.len { if img_changed[i] != 0 { acc[i] = 1; } }
			shot(cam_eye, cam_look);
			report(str("paint", r + 1), heat);
		}
		for i in acc.len {
			if acc[i] != 0 { img_changed[i] = 1; } else { img_changed[i] = 0; }
		}
		var saved = 0;
		for img in acc.len {
			if acc[img] == 0 { continue; }
			let im = gltf::images[img];
			gfx::save_shot(gfx::Shot { w: im.width, h: im.height, pf: 376840196, px: gltf::image_pixels(img) }, str(a[3], "_tex", img, ".png"));
			saved++;
		}
		if saved > 0 { export_glb(a[1], str(a[3], ".glb"), a[3]); }
	}
	gfx::save_shot(gfx::Shot { w: tw, h: th, pf: 376840196, px: rpx }, str(a[3], "_render.png"));
	gfx::save_shot(gfx::Shot { w: tw, h: th, pf: 376840196, px: heat }, str(a[3], "_heat.png"));
	var side byte[>..] = [];
	side.resize(3 * tw * th * 4, 0);
	for y in th {
		for x in tw {
			for c in 4 {
				let i = (y * tw + x) * 4 + c;
				let o = y * tw * 3 * 4 + x * 4 + c;
				side[o] = tpx[i];
				side[o + tw * 4] = rpx[i];
				side[o + 2 * tw * 4] = heat[i];
			}
		}
	}
	gfx::save_shot(gfx::Shot { w: 3 * tw, h: th, pf: 376840196, px: side }, str(a[3], "_side.png"));
}
