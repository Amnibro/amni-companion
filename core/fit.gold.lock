fn bbox(m const f32[:]) int, int, f32 {
	var y0 = -1;
	var y1 = -1;
	var sx f32 = 0.0;
	var n = 0;
	for y in th {
		for x in tw {
			if m[y * tw + x] >= 0.5 {
				if y0 < 0 { y0 = y; }
				y1 = y;
				sx += x as f32;
				n++;
			}
		}
	}
	if n == 0 { return 0, 0, 0.0; }
	return y0, y1, sx / (n as f32);
}
