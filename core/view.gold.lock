export fn hv_nodes(n i32) i32 {
	var got i32 = 0;
	let cnt = n as int;
	for k in cnt {
		if k >= 1024 { break; }
		let q = Q[k] as int;
		if q >= 0 && q < gltf::assets[asset].nodes.count {
			B[k] = gltf::assets[asset].nodes.first + q;
			got += 1;
		} else {
			B[k] = -1;
		}
	}
	nb = min(cnt, 1024);
	return got;
}
