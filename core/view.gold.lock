export fn hv_weights(n i32) {
	let cnt = n as int;
	for i in cnt {
		if i >= 4096 { break; }
		let k = W[i * 3] as int;
		if k >= 0 && k < nb && B[k] >= 0 {
			s3d::set_weight(item, B[k], W[i * 3 + 1] as int, W[i * 3 + 2]);
		}
	}
}
