export fn hv_bones(len i32) i32 {
	let n = len as int;
	let parts = split(N[..n], 10);
	var k = 0;
	var got i32 = 0;
	for p in parts {
		if p.len == 0 { continue; }
		if k < 1024 {
			B[k] = gltf::find_node(asset, p);
			if B[k] >= 0 { got += 1; }
		}
		k++;
	}
	nb = k;
	return got;
}
