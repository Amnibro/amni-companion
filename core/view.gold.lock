export fn hv_bones(len i32) i32 {
	let n = len as int;
	let parts = split(N[..n], 10);
	var k = 0;
	var got i32 = 0;
	for p in parts {
		if p.len == 0 { continue; }
		if k < 1024 {
			B[k] = gltf::find_node(asset, p);
			if B[k] >= 0 { got += 1; }
		}
		k++;
	}
	nb = k;
	return got;
}
=== -18765f2da9e54b28
export fn hv_nodes(n i32) i32 {
	var got i32 = 0;
	let cnt = n as int;
	for k in cnt {
		if k >= 1024 { break; }
		let q = Q[k] as int;
		if q >= 0 && q < gltf::assets[asset].nodes.count {
			B[k] = gltf::assets[asset].nodes.first + q;
			got += 1;
		} else {
			B[k] = -1;
		}
	}
	nb = min(cnt, 1024);
	return got;
}
