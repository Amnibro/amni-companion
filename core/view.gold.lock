	hv_f32(0, P[..]);
	hv_f32(1, C[..]);
	hv_bytes(2, N[..]);
	hv_i32(3, Q[..]);
	hv_f32(4, M[..]);
	hv_f32(5, W[..]);
	gltf::lazy_pixels = true;
	let a = args();
	asset = gltf::load(a[1]);
	if asset < 0 {
		print("view: ", gltf::error());
		return;
	}
	let first = gltf::assets[asset].nodes.first;
	let count = gltf::assets[asset].nodes.count;
	if a.len > 2 {
		for i in count {
			let n = first + i;
			if gltf::nodes[n].mesh >= 0 && gltf::text_of(gltf::meshes[gltf::nodes[n].mesh].name) == "hair" {
				gltf::nodes[n].mesh = -1;
			}
		}
		head = gltf::find_node(asset, "head");
		if head >= 0 {
			motion::rest(asset);
			motion::update(asset, gfx::mat4_identity);
			rest_inv = linalg::inverse(motion::world[head]);
		}
	}
	for i in count {
		let n = first + i;
		if gltf::nodes[n].mesh >= 0 && gltf::text_of(gltf::meshes[gltf::nodes[n].mesh].name) == "teeth" {
			teeth_mat = gltf::prims[gltf::meshes[gltf::nodes[n].mesh].prims.first].material;
