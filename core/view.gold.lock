export fn hv_nodes(n i32) i32 {
	let m = clamp(n as int, 0, 1024);
	let first = gltf::assets[asset].nodes.first;
	let count = gltf::assets[asset].nodes.count;
	var set = 0;
	for k in m {
		let q = Q[k] as int;
		if q >= 0 && q < count {
			B[k] = first + q;
			set += 1;
		} else {
			B[k] = -1;
		}
	}
	nb = m;
	set as i32
}
