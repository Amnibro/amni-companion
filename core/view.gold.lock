	let dx = C[0] - C[8];
	let dz = C[2] - C[10];
	let dl = sqrt((dx * dx + dz * dz) as real) as f32;
	let ca = if dl > 0.002 { dz / dl } else { 1.0 };
	let sa = if dl > 0.002 { dx / dl } else { 0.0 };
	let mid = float3 { C[8], C[9] + 1.5, C[10] };
	fn turn(q float3) float3 {
		float3 { q.x * ca + q.z * sa, q.y, q.z * ca - q.x * sa }
	}
	s3d::sun.to_sun = linalg::unit3(turn(float3 { 0.47, 0.4, 0.77 }));
	let n = min(lit_off.len, s3d::lights.len);
