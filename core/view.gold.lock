export fn hv_bones(len i32) i32 {
	var k = 0;
	var found = 0;
	let parts = split(N[0..len as int], 10);
	for p in parts {
		if p.len > 0 {
			if k < 1024 {
				B[k] = gltf::find_node(asset, p);
				if B[k] >= 0 { found += 1; }
			}
			k += 1;
		}
	}
	nb = k;
	found as i32
}
