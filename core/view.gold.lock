export fn he_frame(t real) {
	if !gfx::frame() { return; }
	for k in nb {
		if B[k] >= 0 {
			let o = k * 10;
			s3d::set_node(item, B[k], float3 { P[o], P[o + 1], P[o + 2] }, linalg::Quat { P[o + 3], P[o + 4], P[o + 5], P[o + 6] }, float3 { P[o + 7], P[o + 8], P[o + 9] });
		}
	}
	s3d::place(item, gfx::mat4 { float4 { M[0], M[1], M[2], M[3] }, float4 { M[4], M[5], M[6], M[7] }, float4 { M[8], M[9], M[10], M[11] }, float4 { M[12], M[13], M[14], M[15] } });
	s3d::place(pad_item, gfx::translate(float3 { C[8], C[9] + 0.002, C[10] }));
	if ring >= 0 {
		s3d::place(ring, gfx::translate(float3 { C[8], C[9] + 0.003, C[10] }));
	}
	s3d::view = s3d::Camera { eye: float3 { C[0], C[1], C[2] }, target: float3 { C[3], C[4], C[5] }, up: float3 { 0.0, 1.0, 0.0 }, fov_y: C[6], near: 0.05, far: 100.0 };
	if teeth_mat >= 0 && C[12] > 0.0 {
		gltf::materials[teeth_mat].base = float4 { teeth_base.x * C[12], teeth_base.y * C[12], teeth_base.z * C[12], teeth_base.w };
		if C[13] > 0.0 {
			gltf::materials[teeth_mat].roughness = C[13];
		}
	}
	if springs > 0 {
		let dt = if last_t < 0.0 { 0.0 } else { min(0.05, (t - last_t) / 1000.0) };
		s3d::pose(item);
		spring_step(dt as f32);
	}
	last_t = t;
	let z = gfx::screen_size();
	if z.x as int != sw || z.y as int != sh {
		sw = z.x as int;
		sh = z.y as int;
		s3d::init(sw, sh);
		if on { hair_size(sw, sh); }
	}
	if s3d::render_begin() {
		if on && head >= 0 {
			let hm = gfx::mul(motion::world[head], rest_inv);
			let hi = linalg::inverse(hm);
			for i in bones {
				hair_pose(i, gfx::mul(hi, gfx::mul(motion::world[gltf::assets[asset].nodes.first + hair_bone(i)], bone_rest[i])));
			}
			hair_draw(hm);
		}
		s3d::render_end(gfx::screen());
	}
}
