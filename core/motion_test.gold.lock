fn packed(pos real[:]) real[264] {
	var r real[264] = [0.0; 264];
	pack_rest(pos, r);
	r
}
fn ident_slots() i32[22] {
	var s i32[22] = [0 as i32; 22];
	for k in 22 { s[k] = k as i32; }
	s
}
fn lmset(lm real[:], i int, x real, y real, z real) {
	lm[4 * i] = x;
	lm[4 * i + 1] = y;
	lm[4 * i + 2] = z;
	lm[4 * i + 3] = 1.0;
}
