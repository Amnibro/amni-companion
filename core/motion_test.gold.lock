fn pack_rest(pos real[:], out real[:]) {
	for k in 22 {
		let b = 12 * k;
		for i in 12 { out[b + i] = 0.0; }
		out[b + 3] = 1.0;
		out[b + 4] = pos[3 * k];
		out[b + 5] = pos[3 * k + 1];
		out[b + 6] = pos[3 * k + 2];
		out[b + 10] = 1.0;
		out[b + 11] = 1.0;
	}
}
