fn setp(p real[:], k int, x real, y real, z real) {
	p[3 * k] = x;
	p[3 * k + 1] = y;
	p[3 * k + 2] = z;
}
fn sym(p real[:], k int, x real, y real, z real) {
	setp(p, k, x, y, z);
	setp(p, k + 4, -x, y, z);
}
fn test_pos() real[66] {
