import cv.motion;
import cv.qm;
fn mkrest(pos real[:]) real[264] {
	var r real[264] = [0.0; 264];
	pack_rest(pos, r);
	r
}
fn mkslot() i32[22] {
	var s i32[22] = [0 as i32; 22];
	for k in 22 { s[k] = k as i32; }
	s
}
fn frame_ident(hy real) real[91] {
	var f real[91] = [0.0; 91];
