fn id_frames() real[91] {
	var f real[91] = [0.0; 91];
	for k in 22 { f[4 * k + 3] = 1.0; }
	f[88] = 0.0;
	f[89] = 1.0;
	f[90] = 0.0;
	f
}
fn put_q(f real[:], k int, q qm::Q4) {
	f[4 * k] = q.x;
	f[4 * k + 1] = q.y;
	f[4 * k + 2] = q.z;
	f[4 * k + 3] = q.w;
}
fn set_lm(lm real[:], i int, x real, y real, z real) {
	lm[4 * i] = x;
	lm[4 * i + 1] = y;
	lm[4 * i + 2] = z;
	lm[4 * i + 3] = 1.0;
}
fn run_target(label const byte[:], slot i32[:], srest real[:], tpos real[:], frames real[:], a int, b int, hips bool) {
	var trest real[264] = [0.0; 264];
	pack_rest(tpos, trest);
	var out real[91] = [0.0; 91];
	kin::retarget_clip(slot, srest, slot, trest, 1, frames, out);
	showq(label, out, a, 4 * a);
	showq(label, out, b, 4 * b);
	if hips {
		var s byte[>..] = [];
		s.append("hips");
		for i in 3 {
			s.push(' ');
			f4(s, out[88 + i]);
		}
		print(s);
	}
}
