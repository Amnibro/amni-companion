fn pack_rest(pos real[:], out real[:]) {
	for k in 22 {
		let b = 12 * k;
		for i in 12 { out[b + i] = 0.0; }
		out[b + 3] = 1.0;
		out[b + 4] = pos[3 * k];
		out[b + 5] = pos[3 * k + 1];
		out[b + 6] = pos[3 * k + 2];
		out[b + 10] = 1.0;
		out[b + 11] = 1.0;
	}
}
fn f4(out byte[>..]&, v real) {
	var x = v;
	if abs(x) < 0.00005 { x = 0.0; }
	format_flt(out, x, 4);
}
fn showq(label const byte[:], a real[:], k int, o int) {
	var s byte[>..] = [];
	if label.len > 0 {
		s.append(label);
		s.push(' ');
	}
	s.append(rig::slot_name(k));
	for i in 4 {
		s.push(' ');
		f4(s, a[o + i]);
	}
	print(s);
}
