fn kc_bones(asset int, out int[>..]&) {
	out.clear();
	let a .= gltf::assets[asset];
	var best = -1;
	var bestn = -1;
	for s in a.skins.count {
		let sk .= gltf::skins[a.skins.first + s];
		if sk.joints.count > bestn {
			bestn = sk.joints.count;
			best = a.skins.first + s;
		}
	}
	if best >= 0 {
		let sk .= gltf::skins[best];
		for j in sk.joints.count {
			out.push(gltf::ints[sk.joints.first + j]);
		}
	} else {
		for n in a.nodes.count {
			out.push(a.nodes.first + n);
		}
	}
}
