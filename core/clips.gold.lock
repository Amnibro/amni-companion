fn kc_facing(asset int, bones int[:], slot i32[:]) gfx::mat4 {
	if slot[7] >= 0 && slot[11] >= 0 {
		motion::rest(asset);
		motion::update(asset, gfx::mat4_identity);
		let lx = pos(motion::world[bones[slot[7]]]).x;
		let rx = pos(motion::world[bones[slot[11]]]).x;
		if lx < rx {
			return linalg::qmatrix(linalg::qaxis(float3 { 0.0, 1.0, 0.0 }, 3.14159265));
		}
	}
	return gfx::mat4_identity;
}
