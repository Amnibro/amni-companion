		kc_slot[k] = -1;
		if avs[k] >= 0 {
			let node = ab[avs[k]];
			kc_slot[k] = node;
			let r = gltf::nodes[node].r;
			arl[4 * k] = r.x as f32;
			arl[4 * k + 1] = r.y as f32;
			arl[4 * k + 2] = r.z as f32;
			arl[4 * k + 3] = r.w as f32;
		}
	}
	motion::rest(asset);
	motion::update(asset, aroot);
	var hips_parent = -1;
	if kc_slot[0] >= 0 { hips_parent = gltf::nodes[kc_slot[0]].parent; }
	var hinv = gfx::mat4_identity;
	if hips_parent >= 0 { hinv = linalg::inverse(motion::world[hips_parent]); }
	let a .= gltf::assets[kc_lib];
	var src real[>..] = [];
	var res real[>..] = [];
	for ai in a.animations.count {
