fn clips_name(c int, out byte[>..]&) {
	out.clear();
	var line = 0;
	var start = 0;
	for i in kc_names.len {
		if kc_names[i] == 10 {
			if line == c {
				out.append(kc_names[start..i]);
				return;
			}
			line++;
			start = i + 1;
		}
	}
