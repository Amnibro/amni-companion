fn kc_rest(asset int, root gfx::mat4, bones int[:], slot i32[:], rest real[:]) bool {
	motion::rest(asset);
	motion::update(asset, root);
	var names byte[>..] = [];
	var parents i32[>..] = [];
	var positions real[>..] = [];
	for i in bones.len {
		let node = bones[i];
		names.append(gltf::text_of(gltf::nodes[node].name));
		names.push(10);
		let pn = gltf::nodes[node].parent;
		var pi i32 = -1;
		for j in bones.len {
			if bones[j] == pn { pi = j as i32; }
		}
		parents.push(pi);
		let wp = pos(motion::world[node]);
		positions.push(wp.x as real);
		positions.push(wp.y as real);
		positions.push(wp.z as real);
	}
	let nb i32 = bones.len as i32;
	rig::rig_map(names[..], nb, parents[..], positions[..], slot);
	if !rig::rig_humanoid(slot) { return false; }
	for i in 264 { rest[i] = 0.0; }
	for k in 22 {
		rest[12 * k + 3] = 1.0;
		rest[12 * k + 10] = 1.0;
		if slot[k] >= 0 {
			let b = bones[slot[k]];
			let q = mquat(motion::world[b]);
			rest[12 * k] = q.x as real;
			rest[12 * k + 1] = q.y as real;
			rest[12 * k + 2] = q.z as real;
			rest[12 * k + 3] = q.w as real;
			let wp = pos(motion::world[b]);
			rest[12 * k + 4] = wp.x as real;
			rest[12 * k + 5] = wp.y as real;
			rest[12 * k + 6] = wp.z as real;
			let p = gltf::nodes[b].parent;
			if p >= 0 {
				let pq = mquat(motion::world[p]);
				rest[12 * k + 7] = pq.x as real;
				rest[12 * k + 8] = pq.y as real;
				rest[12 * k + 9] = pq.z as real;
				rest[12 * k + 10] = pq.w as real;
			}
			rest[12 * k + 11] = 1.0;
		}
	}
	return true;
}
