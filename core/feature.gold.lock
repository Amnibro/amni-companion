fn fe_sphere(ps const float3[:]) float4 {
	var mx real = 0.0;
	var my real = 0.0;
	var mz real = 0.0;
	for p in ps { mx += p.x; my += p.y; mz += p.z; }
	if ps.len > 0 {
		let n real = ps.len;
		mx /= n;
		my /= n;
		mz /= n;
	}
	var far real = 0.0;
	for p in ps {
		let dx real = p.x - mx;
		let dy real = p.y - my;
		let dz real = p.z - mz;
		let d = sqrt(dx * dx + dy * dy + dz * dz);
		if d > far { far = d; }
	}
	let fb = float4 { mx as f32, my as f32, mz as f32, far as f32 };
	if ps.len < 4 { return fb; }
	var m real[20] = [0.0; 20];
	for p in ps {
		let x real = p.x;
		let y real = p.y;
		let z real = p.z;
		let r real[4] = [2.0 * x, 2.0 * y, 2.0 * z, 1.0];
		let t = x * x + y * y + z * z;
		for i in 4 {
			for j in 4 { m[i * 5 + j] += r[i] * r[j]; }
			m[i * 5 + 4] += r[i] * t;
		}
	}
	for col in 4 {
		var best = col;
		for i in col + 1..4 {
			if abs(m[i * 5 + col]) > abs(m[best * 5 + col]) { best = i; }
		}
		if abs(m[best * 5 + col]) < 1e-12 { return fb; }
		if best != col {
			for j in 5 {
				let tmp = m[col * 5 + j];
				m[col * 5 + j] = m[best * 5 + j];
				m[best * 5 + j] = tmp;
			}
		}
		for i in 0..4 {
			if i != col {
				let f = m[i * 5 + col] / m[col * 5 + col];
				for j in col..5 { m[i * 5 + j] -= f * m[col * 5 + j]; }
			}
		}
	}
	let a = m[4] / m[0];
	let b = m[9] / m[6];
	let cz = m[14] / m[12];
	let k = m[19] / m[18];
	let rr = sqrt(k + a * a + b * b + cz * cz);
	float4 { a as f32, b as f32, cz as f32, rr as f32 }
}
