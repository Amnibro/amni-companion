fn feature_setup(path const byte[:], asset int) bool {
	if !file_exists(path) { return false; }
	var data byte[>..] = [];
	read_file(path, data);
	var have = false;
	var found = false;
	fn eyes() bool {
		if !have {
			have = true;
			found = fe_eyes(asset);
		}
		found
	}
	fn reserve() {
		if eyes() && fe_at.len == 0 { fe_reserve(asset); }
	}
	fn frame() bool {
		if !eyes() { return false; }
		fe_arc(asset, fe_c0, fe_arc0);
		fe_arc(asset, fe_c1, fe_arc1);
		fe_arc0.len >= 4 && fe_arc1.len >= 4
	}
	let lines = split(data, '\n');
	for raw in lines {
		let line = trim(raw);
		if line.len == 0 { continue; }
		if line[0] == '#' { continue; }
		var cmd byte[>..] = [];
		var mesh byte[>..] = [];
		var nums real[>..] = [];
		var oks int[>..] = [];
		for w, i in words(line) {
			if i == 0 {
				cmd.append(w);
			} else {
				if i == 1 { mesh.append(w); }
				let v, ok = parse_flt(w);
				nums.push(v);
				oks.push(if ok { 1 } else { 0 });
			}
		}
		if cmd.len == 0 { continue; }
		if cmd == "liner" {
			let st = fe_num(nums, oks, 0, 1.0);
			let w0 = fe_num(nums, oks, 1, 0.05);
			let w1 = fe_num(nums, oks, 2, 0.185);
			let wing = fe_num(nums, oks, 3, 0.3);
			let ang = fe_num(nums, oks, 4, 22.0);
			let lift = fe_num(nums, oks, 5, 0.075);
			let dark = fe_num(nums, oks, 6, 18.0);
			if eyes() {
				reserve();
				if frame() {
					fe_liner(asset, w0 as f32, w1 as f32, wing as f32, ang as f32, lift as f32, dark as f32, st as f32);
				}
			}
		} else if cmd == "lids" {
			let crease = fe_num(nums, oks, 0, 1.0);
			let edge = fe_num(nums, oks, 1, 1.0);
			let passes = fe_num(nums, oks, 2, 25.0);
			let fill = fe_num(nums, oks, 3, 1.0);
			if eyes() {
				var rg f32[>..] = [];
				fe_regions("lids", rg);
				fe_amounts(rg, crease as f32, edge as f32);
				let ps = fe_prims(asset, false);
				fe_soften(asset, ps, rg, passes as int, fill as f32);
			}
		} else if cmd == "clean" {
			let amt = fe_num(nums, oks, 0, 1.0);
			let rad = fe_num(nums, oks, 1, 7.0);
			let keep = fe_num(nums, oks, 2, 0.85);
			if eyes() {
				reserve();
				if frame() {
					var rg f32[>..] = [];
					fe_regions("lids", rg);
					fe_clean(asset, rg, amt as f32, rad as int, keep as f32);
				}
			}
		} else if cmd == "nose" {
			let amt = fe_num(nums, oks, 0, 1.0);
			let passes = fe_num(nums, oks, 1, 25.0);
			let fill = fe_num(nums, oks, 2, 1.0);
			if eyes() {
				var rg f32[>..] = [];
				fe_regions("nose", rg);
				fe_amounts(rg, amt as f32, 0.0);
				let ps = fe_prims(asset, false);
				fe_soften(asset, ps, rg, passes as int, fill as f32);
			}
		} else if cmd == "smooth" {
			let passes = fe_num(nums, oks, 1, 20.0);
			var rg f32[>..] = [];
			fe_row(rg, 0.0, 0.0, 1e5, 1e5, 0.0, 1.0);
			let ps = fe_mesh_prims(asset, mesh);
			fe_soften(asset, ps, rg, passes as int, 0.0);
		} else if cmd == "hide" {
			fe_hide(asset, mesh);
		} else if cmd == "tint" {
			let r = fe_num(nums, oks, 1, 1.0);
			let g = fe_num(nums, oks, 2, 1.0);
			let b = fe_num(nums, oks, 3, 1.0);
			fe_tint(asset, mesh, float3 { r as f32, g as f32, b as f32 });
		} else if cmd == "hair" {
			let r = fe_num(nums, oks, 0, -1.0);
			let g = fe_num(nums, oks, 1, -1.0);
			let b = fe_num(nums, oks, 2, -1.0);
			let gain = fe_num(nums, oks, 3, 1.0);
			fe_hair = float4 { r as f32, g as f32, b as f32, gain as f32 };
		}
	}
	return true;
}
