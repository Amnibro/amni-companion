	var ly real = 0.0;
	var lz real = 0.0;
	var lh real = 0.0;
	for k in n {
		let u = (k as real) / ((n - 1) as real);
		let w = (w0 + (w1 - w0) * pow(u, 1.5)) * L;
		let a = arc[max(k - 1, 0)];
		let b = arc[min(k + 1, n - 1)];
		let tx real = b.x - a.x;
		let ty real = b.y - a.y;
		let tl = sqrt(tx * tx + ty * ty);
		var nx real = 0.0;
		var ny real = 1.0;
		if tl > 0.0 {
			nx = -ty / tl;
			ny = tx / tl;
		}
