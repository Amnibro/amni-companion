fn fe_weight(rg const f32[:], x f32, y f32, col int) f32 {
	var best real = 0.0;
	for r in rg.len / 6 {
		let dx real = (x - rg[r * 6]) / rg[r * 6 + 2];
		let dy real = (y - rg[r * 6 + 1]) / rg[r * 6 + 3];
