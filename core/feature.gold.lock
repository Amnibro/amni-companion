			nx = -nx;
			ny = -ny;
		}
		lx = arc[k].x + nx * w * lift;
		ly = arc[k].y + ny * w * lift;
		lz = arc[k].z;
		lh = w / 2.0;
		out.push(lx as f32);
		out.push(ly as f32);
		out.push(lz as f32);
		out.push(lh as f32);
	}
	let sg real = if arc[n - 1].x > arc[0].x { 1.0 } else { -1.0 };
	let rad real = ang * PI / 180.0;
	let dx = sg * cos(rad);
	let dy = sin(rad);
	let len = wing * L;
	let hend = 0.004 * L;
	let h0 = lh;
	for j in 1..9 {
		let f = (j as real) / 8.0;
		out.push((lx + dx * len * f) as f32);
		out.push((ly + dy * len * f) as f32);
		out.push(lz as f32);
		out.push((h0 + (hend - h0) * f) as f32);
	}
}
