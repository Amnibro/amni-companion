fn fe_bary(a float3, b float3, c float3, x f32, y f32) float3 {
	let ar = (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
	if abs(ar) < 1e-12 { return float3 { -1.0, -1.0, -1.0 }; }
	let w0 = ((b.x - x) * (c.y - y) - (b.y - y) * (c.x - x)) / ar;
	let w1 = ((c.x - x) * (a.y - y) - (c.y - y) * (a.x - x)) / ar;
	float3 { w0, w1, 1.0 - w0 - w1 }
}
