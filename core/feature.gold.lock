		let m = gltf::nodes[(a.nodes.first as int) + n].mesh;
		if m < 0 { continue; }
		let me = gltf::meshes[m];
		if gltf::text_of(me.name) == name {
			for k in (me.prims.count as int) {
				let pp = (me.prims.first as int) + k;
				if !contains(out, pp) { out.push(pp); }
			}
		}
	}
