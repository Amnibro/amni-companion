import cv.life;
import math;
var inp real[11] = [0.0; 11];
var out real[33] = [0.0; 33];
fn run(n int) {
	for i in n {
		inp[0] = 1.0 / 60.0;
		life::life_step(inp, out);
	}
}
fn check(name const byte[:], c bool) {
	print(name, if c { " ok" } else { " bad" });
}
fn main() {
	life::life_reset(7);
	inp[1] = 1.0;
	inp[2] = 0.0;
	inp[3] = 0.0;
	inp[4] = 0.8;
	inp[5] = 0.0;
	inp[6] = 1.0;
	var blinks = 0;
	var prev = out[0];
	for f in 7200 {
		run(1);
		if prev < 0.5 && out[0] >= 0.5 { blinks++; }
		prev = out[0];
	}
	check("blinks", blinks >= 16 && blinks <= 48);
	life::life_reset(7);
	run(60);
	inp[2] = 0.5;
	var c = 0;
	while c < 60 {
		run(1);
		c++;
		if abs(out[14] - 0.5) < 0.06 { break; }
	}
	check("saccade", c >= 4 && c <= 9);
	var within = true;
	for f in 90 {
		run(1);
		if abs(out[12]) > 0.21 + 1e-9 { within = false; }
	}
	check("eye limit", within && out[10] > 0.25);
	life::life_reset(7);
	inp[2] = 0.0;
	run(120);
	inp[2] = 0.6;
	run(7);
	let h0 = out[10];
	var err = 0.0;
	for f in 23 {
		run(1);
		err = max(err, abs(out[14] - 0.6));
	}
	let h1 = out[10];
	check("vor", h1 - h0 > 0.03 && err < 0.08);
	life::life_reset(7);
	inp[2] = 0.0;
	inp[4] = 0.3;
	run(120);
	let v1 = out[30];
	inp[4] = 3.0;
	run(120);
	let v2 = out[30];
	check("vergence", v1 > 0.08 && v2 < 0.03);
	life::life_reset(7);
	life::life_say("map", 0.0, 1.0);
	inp[7] = 0.0325;
	run(1);
	check("closure", out[19] >= 0.45 && out[16] <= 0.12);
	inp[7] = 0.114;
	run(1);
	check("open", out[16] >= 0.4);
	life::life_say("oo", 0.5, 1.0);
	inp[7] = 0.42;
	run(1);
	let a = out[18];
	inp[7] = 0.2;
	run(1);
	let b = out[18];
	check("anticipation", a > 0.1 && a < 0.8 && b < 0.05);
	inp[7] = 3.0;
	run(1);
	var quiet = true;
	for k in 16..28 {
		if out[k] >= 0.01 { quiet = false; }
	}
	check("rest", quiet);
	var p real[1512] = [0.0; 1512];
	var d real[1512] = [0.0; 1512];
	let cs = cos(0.25);
	let sn = sin(0.25);
	var k = 0;
	for i in 21 {
		for j in 24 {
			let pa = 1.92 * i / 20.0;
			let pb = 2.0 * PI * j / 24.0;
			let ox = 0.012 * sin(pa) * cos(pb);
			let oy = 0.012 * sin(pa) * sin(pb);
			let oz = 0.012 * cos(pa);
			p[3 * k] = 0.03 + ox;
			p[3 * k + 1] = 1.5 + oy;
			p[3 * k + 2] = 0.1 + oz;
			let ry = oy * cs + oz * sn;
			let rz = oz * cs - oy * sn;
			d[3 * k] = 0.0;
			d[3 * k + 1] = ry - oy;
			d[3 * k + 2] = rz - oz;
			k++;
		}
	}
	let u = life::life_eye_cal(p, d, 504, 1);
	for q in 1512 { d[q] = -d[q]; }
	let w = life::life_eye_cal(p, d, 504, 1);
	check("calibration", abs(u - 0.25) < 0.02 && abs(w + 0.25) < 0.02);
	life::life_reset(7);
	inp[1] = 1.0;
	inp[2] = 0.0;
	inp[3] = 0.0;
	inp[4] = 0.8;
	inp[5] = 0.0;
	inp[7] = 0.0;
	var breaths = 0;
	var mn = 1e30;
	var mx = -1e30;
	var bp = out[32];
	for f in 3600 {
		run(1);
		let v = out[32];
		if bp < 0.5 && v >= 0.5 { breaths++; }
		mn = min(mn, v);
		mx = max(mx, v);
		bp = v;
	}
	check("breath idle", breaths >= 10 && breaths <= 18 && mn >= 0.0 && mx <= 1.25);
	life::life_reset(7);
	inp[5] = 1.0;
	life::life_say("one two three four, five six seven eight.", 0.5, 1.0);
	var pause = false;
	var mid = false;
	var sp = out[32];
	for f in 1..301 {
		inp[7] = f / 60.0;
		run(1);
		let v = out[32];
		if v > sp {
			let t = inp[7];
			if t >= 1.52 && t <= 1.76 { pause = true; }
			if t >= 0.75 && t <= 1.2 { mid = true; }
		}
		sp = v;
	}
	check("breath speech", pause && !mid);
}
