		var ws f32[..12] = [];
		let cs int[3] = [i0, i1, i2];
		for g in cs {
			let base = g * gltf::VERTEX_FLOATS;
			for k in 4 {
				let j = gltf::verts[base + gltf::AT_JOINT + k] as int;
				let w = gltf::verts[base + gltf::AT_WEIGHT + k];
				var found = false;
				for e in js.len {
					if js[e] == j {
						ws[e] += w;
						found = true;
					}
				}
				if !found {
					js.push(j);
					ws.push(w);
				}
			}
		}
		var best = 0;
		for e in js.len {
			if ws[e] > ws[best] {
				best = e;
			}
		}
		let slot = js[best];
		let node = gltf::ints[jfirst + slot] as int;
		rb.push(region(gltf::text_of(gltf::nodes[node].name)));
	}
