	}
	var mesh const byte[:] = "skin";
	var found = false;
	for i in 3..a.len {
		let s = a[i];
		if found {
			continue;
		}
		if starts_with(s, "move=") || starts_with(s, "knee=") || starts_with(s, "elbow=") || starts_with(s, "hip=") {
			continue;
		}
		if s == "dump" || s == "cor" || s == "half" || s == "twist" {
			continue;
		}
		mesh = s;
		found = true;
	}
	gather(asset, mesh);
	if bt.len == 0 {
		return;
	}
	if cor_on {
		cor_build(asset, mesh);
	}
	print("skin tris ", bt.len / 3, " height ", h0, " to ", h1, " clips ", nlib);
	measure(it, "bind");
	let names = ["Idle_Loop", "Walk_Formal_Loop", "Dance_Loop", "Sitting_Idle_Loop"];
	let at f32[16] = [1.0, 0.0, 0.0, 0.0, 0.5, 1.0, 0.0, 0.0, 0.7, 1.4, 2.1, 2.8, 1.0, 2.0, 3.0, 0.0];
	for ci in 4 {
		let c = find_clip(names[ci], nlib);
		if c < 0 {
			print("no clip ", names[ci]);
			continue;
		}
		mix_play(c, 0.0);
		var t f32 = 0.0;
		for si in 4 {
			let target = at[ci * 4 + si];
			if target <= 0.0 {
				continue;
			}
			while t + 0.0001 < target {
				mix_advance(1.0 / 60.0);
				t += 1.0 / 60.0;
			}
			var tag byte[>..] = [];
			tag.append(names[ci]);
			tag.push(' ');
			tag.append(str(target));
			measure(it, tag);
		}
	}
	let angs f32[2] = [-1.4, 1.4];
	let hands int[2] = [9, 13];
	for ang in angs {
		mix_rest();
		for k in hands {
			if slot_node[k] >= 0 {
				mix_set(k, linalg::qmul(linalg::qaxis(linalg::unit3(gltf::nodes[slot_node[k]].t), ang), rest_q[k]));
			}
		}
		push();
		if ang < 0.0 {
			measure(it, "hands turned -1.4");
		} else {
			measure(it, "hands turned 1.4");
		}
	}
}
