fn measure(it int, tag const byte[:]) {
	s3d::pose(it);
	motion::joints(sk_i, pal);
	var fo int[>..] = [];
	fo.resize(NB, 0);
	var cr int[>..] = [];
	cr.resize(NB, 0);
	var st int[>..] = [];
	st.resize(NB, 0);
	var F = 0;
	var C = 0;
	var X = 0;
	for t in bt.len / 3 {
		if ra[t] > 1.0e-10 {
			let i0 = bt[3 * t];
			let i1 = bt[3 * t + 1];
			let i2 = bt[3 * t + 2];
			let pa = skp(i0, pal[..]);
			let pb = skp(i1, pal[..]);
			let pc = skp(i2, pal[..]);
			let ng = tri_cross(pb - pa, pc - pa);
			let area = 0.5 * linalg::length3(ng);
			let nr = skn(i0, pal[..]) + skn(i1, pal[..]) + skn(i2, pal[..]);
			let folded = linalg::dot3(ng, nr) < 0.0;
			let crushed = area < 0.3 * ra[t];
			let stretched = area > 2.5 * ra[t];
			let r = rb[t];
			if folded {
				fo[r] += 1;
				F += 1;
			}
			if crushed {
				cr[r] += 1;
				C += 1;
			}
			if stretched {
				st[r] += 1;
				X += 1;
			}
			if dump && starts_with(tag, "Sitting_Idle_Loop 2") && r == 0 && (folded || crushed) {
				let a = vp(i0);
				let b = vp(i1);
				let c = vp(i2);
				let cx = (a.x + b.x + c.x) / 3.0;
				let cy = (a.y + b.y + c.y) / 3.0;
				let cz = (a.z + b.z + c.z) / 3.0;
				let mark = if folded { "F " } else { "C " };
				print(mark, cx, " ", cy, " ", cz);
			}
		}
	}
	print(tag, " folded ", F, " crushed ", C, " stretched ", X, " of ", bt.len / 3);
	for k in NB {
		if fo[k] + cr[k] + st[k] > 0 {
			print("  ", rname(k), " folded ", fo[k], " crushed ", cr[k], " stretched ", st[k]);
		}
	}
}
