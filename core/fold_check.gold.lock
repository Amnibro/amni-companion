		let s = sqrt(max(1.0 + m00 - m11 - m22, 1.0e-20)) * 2.0;
		w = (m21 - m12) / s;
		x = 0.25 * s;
		y = (m01 + m10) / s;
		z = (m02 + m20) / s;
	} else if m11 > m22 {
		let s = sqrt(max(1.0 + m11 - m00 - m22, 1.0e-20)) * 2.0;
		w = (m02 - m20) / s;
		x = (m01 + m10) / s;
		y = 0.25 * s;
		z = (m12 + m21) / s;
	} else {
		let s = sqrt(max(1.0 + m22 - m00 - m11, 1.0e-20)) * 2.0;
		w = (m10 - m01) / s;
		x = (m02 + m20) / s;
		y = (m12 + m21) / s;
		z = 0.25 * s;
	}
	var q linalg::Quat = default<linalg::Quat>();
	q.x = x as f32;
	q.y = y as f32;
	q.z = z as f32;
	q.w = w as f32;
