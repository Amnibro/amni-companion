fn world_rot(nd int) linalg::Quat {
	var q = gltf::nodes[nd].r;
	var k = gltf::nodes[nd].parent as int;
	while k >= 0 {
		q = linalg::qmul(gltf::nodes[k].r, q);
		k = gltf::nodes[k].parent as int;
	}
	q
}
