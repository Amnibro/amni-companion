fn cor_src(asset int, nm const byte[:], src SrcTri[>..]&) {
	let nd = gltf::find_node(asset, nm);
	if nd < 0 {
		return;
	}
	let ms = gltf::meshes[gltf::nodes[nd].mesh as int];
	for pi in ms.prims.count as int {
		let pr = gltf::prims[ms.prims.first as int + pi];
		let vf = pr.vfirst as int;
		let ifs = pr.ifirst as int;
		for t in pr.icount as int / 3 {
			let i0 = vf + gltf::indices[ifs + 3 * t] as int;
			let i1 = vf + gltf::indices[ifs + 3 * t + 1] as int;
			let i2 = vf + gltf::indices[ifs + 3 * t + 2] as int;
			let a = vp(i0);
			let b = vp(i1);
			let c = vp(i2);
			var st = default<SrcTri>();
			st.cx = (a.x + b.x + c.x) / 3.0;
			st.cy = (a.y + b.y + c.y) / 3.0;
			st.cz = (a.z + b.z + c.z) / 3.0;
			st.area = 0.5 * linalg::length3(tri_cross(b - a, c - a));
			st.n = 0;
			let cs int[3] = [i0, i1, i2];
			for g in cs {
				let base = g * gltf::VERTEX_FLOATS;
				for k in 4 {
					let j = gltf::verts[base + gltf::AT_JOINT + k] as int;
					let w = gltf::verts[base + gltf::AT_WEIGHT + k];
					if w > 0.0 {
						var found = false;
						for e in st.n {
							if st.js[e] == j {
								st.ws[e] += w / 3.0;
								found = true;
							}
						}
						if !found && st.n < 12 {
							st.js[st.n] = j;
							st.ws[st.n] = w / 3.0;
							st.n += 1;
						}
					}
				}
			}
			src.push(st);
		}
	}
}
