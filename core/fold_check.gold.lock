fn gather(asset int, name const byte[:]) {
	let nd = gltf::find_node(asset, name);
	if nd < 0 {
		print("no node ", name);
		return;
	}
	sk_i = gltf::nodes[nd].skin as int;
	let ms = gltf::meshes[gltf::nodes[nd].mesh as int];
	for pi in ms.prims.count as int {
		let pr = gltf::prims[ms.prims.first as int + pi];
		let vf = pr.vfirst as int;
		for v in pr.vcount as int {
			let y = vp(vf + v).y;
			h0 = min(h0, y);
			h1 = max(h1, y);
		}
		for q in pr.icount as int {
			bt.push(vf + gltf::indices[pr.ifirst as int + q] as int);
		}
	}
	let jfirst = gltf::skins[sk_i].joints.first as int;
	for t in ra.len..bt.len / 3 {
		let i0 = bt[3 * t];
		let i1 = bt[3 * t + 1];
		let i2 = bt[3 * t + 2];
		let a = vp(i0);
		let b = vp(i1);
		let c = vp(i2);
		ra.push(0.5 * linalg::length3(tri_cross(b - a, c - a)));
