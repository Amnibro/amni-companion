fn vp(g int) float3 {
	let b = g * gltf::VERTEX_FLOATS;
	float3 { gltf::verts[b], gltf::verts[b + 1], gltf::verts[b + 2] }
}
fn vn(g int) float3 {
	let b = g * gltf::VERTEX_FLOATS;
	float3 { gltf::verts[b + 3], gltf::verts[b + 4], gltf::verts[b + 5] }
}
fn skp(g int, m gfx::mat4[:]) float3 {
	let b = g * gltf::VERTEX_FLOATS;
	var s = float3 { 0.0, 0.0, 0.0 };
	for q in 4 {
		let w = gltf::verts[b + 22 + q];
		if w > 0.0 {
			s = s + linalg::point(m[gltf::verts[b + 18 + q] as int], vp(g)) * w;
		}
	}
	s
}
fn skn(g int, m gfx::mat4[:]) float3 {
	let b = g * gltf::VERTEX_FLOATS;
	let p = vp(g);
	let n = vn(g);
	var s = float3 { 0.0, 0.0, 0.0 };
	for q in 4 {
		let w = gltf::verts[b + 22 + q];
		if w > 0.0 {
			let mm = m[gltf::verts[b + 18 + q] as int];
			s = s + (linalg::point(mm, p + n) - linalg::point(mm, p)) * w;
		}
	}
	linalg::unit3(s)
}
