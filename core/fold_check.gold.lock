fn region(name const byte[:]) int {
	if starts_with(name, "pelvis") || starts_with(name, "thigh") {
		return 0;
	}
	if starts_with(name, "calf") || starts_with(name, "foot") || starts_with(name, "ball") {
		return 1;
	}
	if starts_with(name, "spine") {
		return 2;
	}
	if starts_with(name, "clavicle") || starts_with(name, "upperarm") {
		return 3;
	}
	if starts_with(name, "lowerarm") {
		return 4;
	}
	if starts_with(name, "hand") || starts_with(name, "index") || starts_with(name, "middle") || starts_with(name, "pinky") || starts_with(name, "ring") || starts_with(name, "thumb") {
		return 5;
	}
	if starts_with(name, "neck") || starts_with(name, "head") {
		return 6;
	}
	7
}
