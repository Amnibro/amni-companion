	let m10 real = c0.y;
	let m20 real = c0.z;
	let m01 real = c1.x;
	let m11 real = c1.y;
	let m21 real = c1.z;
	let m02 real = c2.x;
	let m12 real = c2.y;
	let m22 real = c2.z;
	var x real = 0.0;
	var y real = 0.0;
	var z real = 0.0;
	var w real = 1.0;
	let tr = m00 + m11 + m22;
	if tr > 0.0 {
		let s = sqrt(tr + 1.0) * 2.0;
		w = 0.25 * s;
