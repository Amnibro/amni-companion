fn move_joint(asset int, spec const byte[:]) {
	var ci = -1;
	for ch, i in spec {
		if ch == ':' && ci < 0 {
			ci = i;
		}
	}
	guard ci >= 0 else {
		print("no joint ", spec);
		return;
	}
	let name = spec[..ci];
	let rest = spec[ci + 1..];
	var v real[3] = [0.0; 3];
	var n = 0;
	let parts = split(rest, ',');
	for p in parts {
		if n < 3 {
			let x, ok = parse_flt(trim(p));
			if ok {
				v[n] = x;
			}
			n += 1;
		}
	}
	let nd = gltf::find_node(asset, name);
	if nd < 0 {
		print("no joint ", name);
		return;
	}
	let d = float3 { v[0] as f32, v[1] as f32, v[2] as f32 };
	let parent = gltf::nodes[nd].parent as int;
	if parent < 0 {
		gltf::nodes[nd].t = gltf::nodes[nd].t + d;
	} else {
		gltf::nodes[nd].t = gltf::nodes[nd].t + linalg::qrotate(quat_conj(world_rot(parent)), d);
	}
	let dl = linalg::qrotate(quat_conj(world_rot(nd)), d);
	let chs = gltf::nodes[nd].children;
	for k in chs.count {
		let c = gltf::ints[chs.first + k] as int;
		gltf::nodes[c].t = gltf::nodes[c].t - dl;
	}
	let zero = float3 { 0.0, 0.0, 0.0 };
	let sks = gltf::assets[asset].skins;
	for k in sks.count {
		let s = sks.first + k;
		let jt = gltf::skins[s].joints;
		for j in jt.count {
			if gltf::ints[jt.first + j] as int == nd {
				let mi = gltf::skins[s].inverse_binds.first + j;
				let m = gltf::matrices[mi];
				gltf::matrices[mi] = gfx::mul(gfx::translate(zero - (linalg::point(m, d) - linalg::point(m, zero))), m);
			}
		}
	}
	print("moved ", name);
}
