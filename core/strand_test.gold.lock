fn main() {
	let a = args();
	let eye = float3 { real_arg(a[4]), real_arg(a[5]), real_arg(a[6]) };
	let target = float3 { real_arg(a[7]), real_arg(a[8]), real_arg(a[9]) };
	let spc, spc_ok = parse_int(a[10]);
	if !gfx::open_headless(768, 1024) {
		print("gpu: skipped (no device: ", gfx::error(), ")");
		return;
	}
	let model = gltf::load(a[1]);
	if model < 0 {
		print("load failed: ", gltf::error());
		return;
	}
	let item = s3d::add(model);
	s3d::place(item, gfx::translate(float3 { 0.0, 0.0, 0.0 }));
	s3d::view = s3d::Camera { eye: eye, target: target, up: float3 { 0.0, 1.0, 0.0 }, fov_y: 0.5, near: 0.02, far: 60.0 };
	s3d::sun.shadows = true;
	s3d::init(768, 1024);
	let scene = gfx::render_target(768, 1024, gfx::RGBA8);
	var data byte[>..] = [];
	if !read_file(a[2], data) {
		print("guides failed");
		return;
	}
	let points = binary::gather(data, 8, 4) as int;
	let segments = binary::gather(data, 12, 4) as int;
	let pend = 16 + points * 48;
	let pts = gfx::buffer(gfx::BUFFER_COMPUTE_READ, points * 48, data[16..pend]);
	let segs = gfx::buffer(gfx::BUFFER_COMPUTE_READ, segments * 16, data[pend..pend + segments * 16]);
	var zeros byte[>..] = [];
	zeros.resize(768 * 1024 * 64, 0);
	let rw = gfx::BUFFER_COMPUTE_WRITE | gfx::BUFFER_COMPUTE_READ;
	let front = gfx::buffer(rw, 768 * 1024 * 4, zeros[..768 * 1024 * 4]);
	let acc = gfx::buffer(rw, 768 * 1024 * 64, zeros[..]);
	let lfront = gfx::buffer(rw, 512 * 512 * 4, zeros[..512 * 512 * 4]);
	let lacc = gfx::buffer(rw, 512 * 512 * 64, zeros[..512 * 512 * 64]);
	let hairt = gfx::texture(gfx::TextureDesc { format: gfx::RGBA16F, usage: gfx::SAMPLED | gfx::COMPUTE_WRITE, width: 768, height: 1024 });
	let smp = gfx::sampler(gfx::NEAREST, gfx::CLAMP);
	let comp = gfx::pipeline(embed_shader("shaders/strand_comp.vert"), embed_shader("shaders/strand_comp.frag"), gfx::PipelineDesc { blend: gfx::BLEND_PREMULTIPLIED });
	let clear_p = gfx::compute_pipeline(embed_shader("shaders/strand_clear.comp"));
	let raster_p = gfx::compute_pipeline(embed_shader("shaders/strand_raster.comp"));
	let resolve_p = gfx::compute_pipeline(embed_shader("shaders/strand_resolve.comp"));
	var sx f32 = 0.0;
	var sy f32 = 0.0;
	var sz f32 = 0.0;
	for k in points {
		let at = 16 + k * 48;
		sx += binary::f32_from_bits(binary::gather(data, at, 4) as! u32);
		sy += binary::f32_from_bits(binary::gather(data, at + 4, 4) as! u32);
		sz += binary::f32_from_bits(binary::gather(data, at + 8, 4) as! u32);
	}
	let np = points as f32;
	let center = float3 { sx / np, sy / np, sz / np };
	var u = default<HairU>();
	fn raster(rw0 gfx::Buffer, rw1 gfx::Buffer, ro0 gfx::Buffer, ro1 gfx::Buffer, mode int) {
		gfx::begin_compute([rw0, rw1]);
		gfx::bind(raster_p);
		u.look.z = mode as f32;
		gfx::uniforms(gfx::COMPUTE, 0, u);
		gfx::bind_texture(gfx::COMPUTE, 0, s3d::nd_target(), smp);
		gfx::bind_texture(gfx::COMPUTE, 1, s3d::shadow_map, smp);
		gfx::bind_storage_buffer(gfx::COMPUTE, 0, pts);
		gfx::bind_storage_buffer(gfx::COMPUTE, 1, segs);
		gfx::bind_storage_buffer(gfx::COMPUTE, 2, ro0);
		gfx::bind_storage_buffer(gfx::COMPUTE, 3, ro1);
		gfx::dispatch((segments + 63) / 64, spc, 1);
		gfx::end_compute();
	}
	for frame in 3 {
		if !s3d::ready { continue; }
		s3d::upload_geometry();
		s3d::setup_view();
		s3d::setup_cascades();
		s3d::gather();
		s3d::warm_textures();
		s3d::fill_frame();
		s3d::gi_pass();
		s3d::fill_frame();
		s3d::shadow_pass();
		s3d::ao_pass();
		s3d::color_pass();
		let sun = linalg::unit3(s3d::sun.to_sun);
		let ld = linalg::unit3(s3d::sun.to_sun);
		let rgb = s3d::sun.rgb;
		let leye = center + ld * 3.0;
		u.view_proj = s3d::view_proj_nj;
		u.view = s3d::view_mat;
		u.proj = s3d::proj_mat;
		u.size = float4 { 768.0, 1024.0, spc as f32, segments as f32 };
		u.cam = float4 { eye.x, eye.y, eye.z, 0.7 };
		u.to_sun = float4 { sun.x, sun.y, sun.z, 0.0 };
		u.sun_rgb = float4 { rgb.x, rgb.y, rgb.z, 0.0 };
		u.hair = float4 { 0.58, 0.38, 0.14, 0.42 };
		u.sky = float4 { 0.12, 0.13, 0.15, 40.0 };
		u.params = float4 { 0.004, 1.7, 0.004, 0.00007 };
		u.look = float4 { 1.0, 6.0, 0.0, 0.7 };
		u.light_vp = gfx::mul(gfx::perspective(0.24, 1.0, 2.0, 4.0), gfx::look_at(leye, center, float3 { 0.0, 1.0, 0.0 }));
		u.light = float4 { 512.0, 512.0, 0.35, (256.0 / tan(0.12)) as f32 };
		u.shadow_vp = s3d::cascade_vp[0];
		gfx::begin_compute([front, acc]);
		gfx::bind(clear_p);
		u.look.z = 0.0;
		gfx::uniforms(gfx::COMPUTE, 0, u);
		gfx::dispatch((768 * 1024 + 63) / 64, 1, 1);
		gfx::end_compute();
		gfx::begin_compute([lfront, lacc]);
		gfx::bind(clear_p);
		u.look.z = 2.0;
		gfx::uniforms(gfx::COMPUTE, 0, u);
		gfx::dispatch((512 * 512 + 63) / 64, 1, 1);
		gfx::end_compute();
		raster(lfront, lacc, front, acc, 2);
		raster(lfront, lacc, front, acc, 3);
		raster(front, acc, lfront, lacc, 0);
		raster(front, acc, lfront, lacc, 1);
		gfx::begin_compute([], [hairt]);
		gfx::bind(resolve_p);
		u.look.z = 1.0;
		gfx::uniforms(gfx::COMPUTE, 0, u);
		gfx::bind_storage_buffer(gfx::COMPUTE, 0, acc);
		gfx::dispatch((768 + 7) / 8, (1024 + 7) / 8, 1);
		gfx::end_compute();
		if gfx::begin_pass(gfx::PassDesc { color: [s3d::hdr_target(), gfx::Texture{0}, gfx::Texture{0}, gfx::Texture{0}], clear_color: false, .. }) {
			gfx::bind(comp);
			gfx::bind_texture(gfx::FRAGMENT, 0, hairt, smp);
			gfx::draw(3);
			gfx::end_pass();
		}
		s3d::lens_pass();
		s3d::temporal_pass();
		s3d::glow_pass();
		s3d::grade_pass(scene);
		for i in s3d::items.len { s3d::items[i].prev_place = s3d::items[i].place; }
		s3d::frames += 1;
	}
	if gfx::save_png(scene, a[3]) {
		print("saved ", a[3]);
	} else {
		print("error: ", gfx::error());
	}
}
